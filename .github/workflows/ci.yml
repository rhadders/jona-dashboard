name: CI

# Lint, typecheck, tests en de build, op de eigen runner (zoals de andere
# Jona-repo's). Staat uit tot de variabele CI_ENABLED op `true` staat: een
# nieuwe repo heeft nog geen runner, en een job zonder runner blijft anders een
# dag in de wachtrij staan. Zie docs/deployment.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: vars.CI_ENABLED == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
